          \            review.get('verdict') in ('PASS', 'NEEDS_REVIEW'))\n      \
          \  if not valid:\n            raise ValueError('incomplete_review')\n  \
          \      issues.extend(review['issues'])\n        passed = review['verdict']\
          \ == 'PASS' and all(checks[k] for k in names) and not issues\n    except\
          \ (ValueError, TypeError, AttributeError):\n        review = {'verdict':\
          \ 'NEEDS_REVIEW', 'format_error': True}\n        passed = False\n      \
          \  issues.append({'type': 'review_format_error', 'message': '复核结果格式不正确，未放行报告。'})\n\
