          s*```$', '', text)\n    try:\n        result = json.loads(text)\n    except\
          \ (ValueError, TypeError):\n        raise ValueError('来源选择未返回有效JSON；请查看该节点输出，不自动猜测网址。')\n\
          \    by_id = {c['candidate_id']: c for c in candidates}\n    selected, seen\
          \ = [], set()\n    for item in result.get('selected', []):\n        cid\
          \ = item.get('candidate_id')\n        if cid not in by_id:\n           \
          \ raise ValueError('来源选择引用了搜索结果不存在的候选编号。')\n        if cid in seen:\n  \
          \          continue\n        seen.add(cid)\n        c = dict(by_id[cid])\n\
          \        kind = item.get('source_type', 'unknown')\n        if kind not\
          \ in ('primary_candidate', 'retailer', 'third_party', 'community', 'unknown'):\n\
