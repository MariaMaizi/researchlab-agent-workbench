    - data:
        code: "import json\nimport re\n\n\ndef main(candidates_json: str, selection_text:\
          \ str) -> dict:\n    candidates = json.loads(candidates_json)\n    text\
          \ = re.sub(r'<think\\b[^>]*>.*?</think>', '', selection_text, flags=re.S\
          \ | re.I).strip()\n    if re.search(r'</?think\\b', text, re.I):\n     \
          \   raise ValueError('来源选择输出未分离完整思考标签，请检查模型配置。')\n    if text.startswith('```'):\n\
          \        text = re.sub(r'^```(?:json)?\\s*', '', text)\n        text = re.sub(r'\\\
          s*```$', '', text)\n    try:\n        result = json.loads(text)\n    except\
          \ (ValueError, TypeError):\n        raise ValueError('来源选择未返回有效JSON；请查看该节点输出，不自动猜测网址。')\n\
          \    by_id = {c['candidate_id']: c for c in candidates}\n    selected, seen\
          \ = [], set()\n    for item in result.get('selected', []):\n        cid\
          \ = item.get('candidate_id')\n        if cid not in by_id:\n           \
          \ raise ValueError('来源选择引用了搜索结果不存在的候选编号。')\n        if cid in seen:\n  \
          \          continue\n        seen.add(cid)\n        c = dict(by_id[cid])\n\
          \        kind = item.get('source_type', 'unknown')\n        if kind not\
          \ in ('primary_candidate', 'retailer', 'third_party', 'community', 'unknown'):\n\
          \            kind = 'unknown'\n        c['source_type'] = kind\n       \
          \ c['selection_reason'] = str(item.get('reason', ''))[:500]\n        c['authority_status']\
          \ = 'model_assessed_not_verified'\n        selected.append(c)\n        if\
          \ len(selected) == 1:\n            break\n    if not selected:\n       \
          \ raise ValueError('未选到相关来源，请明确对象/规格或调整查询；不调用空网址。')\n    urls = [c['url']\
          \ for c in selected]\n    return {'urls': urls, 'urls_text': ','.join(urls),\n\
          \            'selection_json': json.dumps({'selected': selected,\n     \
          \         'primary_candidate_selected': any(c['source_type'] == 'primary_candidate'\
          \ for c in selected),\n              'authority_note': '来源类别由模型基于候选信息判断，尚未经独立认证'},\
          \ ensure_ascii=False)}\n"
