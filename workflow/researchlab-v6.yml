        code: "import json\nimport re\n\n\ndef parse(text):\n    text = re.sub(r'<think\\\
          b[^>]*>.*?</think>', '', text, flags=re.S | re.I).strip()\n    if text.startswith('```'):\n\
          \        text = re.sub(r'^```(?:json)?\\s*', '', text)\n        text = re.sub(r'\\\
          s*```$', '', text)\n    return json.loads(text)\n\n\ndef norm(text):\n \
          \   return re.sub(r'\\s+', ' ', str(text)).strip()\n\n\ndef main(facts_text:\
          \ str, evidence_json: str, plan_json: str) -> dict:\n    data, ledger =\
          \ parse(facts_text), json.loads(evidence_json)\n    if not isinstance(data,\
          \ dict) or not isinstance(data.get('facts'), list):\n        raise ValueError('事实提取格式错误：需要包含\
          \ facts 数组的JSON对象。')\n    plan = json.loads(plan_json)\n    pairs = {(o['id'],\
          \ d['id']) for o in plan['objects'] for d in plan['dimensions']}\n    by_id\
          \ = {s['source_id']: s for s in ledger['sources']}\n    accepted, rejected\
          \ = [], []\n    required = ('object_id', 'dimension_id', 'object', 'attribute',\
          \ 'value', 'unit', 'conditions', 'source_id', 'quote', 'claim_type')\n \
          \   for i, fact in enumerate(data['facts'][:24]):\n        reasons = []\n\
          \        if not isinstance(fact, dict):\n            rejected.append({'input_index':\
          \ i, 'reasons': ['not_object']})\n            continue\n        if any(k\
          \ not in fact or not isinstance(fact[k], str) for k in required):\n    \
          \        rejected.append({'input_index': i, 'reasons': ['missing_or_non_string_field']})\n\
          \            continue\n        if (fact['object_id'], fact['dimension_id'])\
          \ not in pairs:\n            reasons.append('unknown_matrix_cell')\n   \
          \     source = by_id.get(fact.get('source_id'))\n        if not source:\n\
          \            reasons.append('unknown_source_id')\n        elif source.get('publisher_type')\
          \ not in ('primary_candidate', 'retailer'):\n            reasons.append('source_not_eligible')\n\
          \        elif source.get('evidence_type') != 'extracted_web_content' or\
          \ source.get('read_status') != 'success':\n            reasons.append('full_content_not_read')\n\
          \        if source and (len(norm(fact.get('quote', ''))) < 12 or\n     \
          \                  norm(fact.get('quote', '')) not in norm(source.get('content',\
          \ ''))):\n            reasons.append('quote_not_found_in_retained_content')\n\
          \        if fact.get('claim_type') not in ('documented_claim', 'retailer_listing'):\n\
          \            reasons.append('unsupported_claim_type')\n        if reasons:\n\
          \            rejected.append({'input_index': i, 'source_id': fact.get('source_id'),\
          \ 'reasons': reasons})\n            continue\n        out = {k: fact[k]\
          \ for k in required}\n        out.update(fact_id='F' + str(len(accepted)\
          \ + 1), title=source['title'],\n                   url=source['url'], observed_at_utc=source['observed_at_utc'],\n\
          \                   content_truncated=source.get('content_truncated', False),\n\
          \                   authority_status=source.get('authority_status', 'model_assessed_not_verified'))\n\
          \        accepted.append(out)\n    result = {'facts': accepted, 'missing':\
          \ data.get('missing', []),\n              'clarifications': data.get('clarifications',\
          \ []),\n              'collection_warnings': ledger.get('warnings', [])}\n\
          \    audit = {'accepted_count': len(accepted), 'rejected_count': len(rejected),\n\
          \             'rejected': rejected, 'semantic_support_checked': False,\n\
          \             'note': '仅验证字段、来源与保留原文片段存在性；不证明原文支持字段含义或适用型号。'}\n    return\
          \ {'verified_facts_json': json.dumps(result, ensure_ascii=False),\n    \
          \        'fact_audit': json.dumps(audit, ensure_ascii=False)}\n"
