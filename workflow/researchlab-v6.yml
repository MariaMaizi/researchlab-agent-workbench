    - data:
        code: "import json\nimport hashlib\nfrom datetime import datetime, timezone\n\
          \n\ndef main(search_json: list, extract_json: list, requested_urls: list,\
          \ query: str, selection_json: str) -> dict:\n    \"\"\"Normalize observed\
          \ tool results, never invent successful extraction.\"\"\"\n    fetched_at\
          \ = datetime.now(timezone.utc).isoformat()\n    search = {}\n    for response\
          \ in search_json or []:\n        for row in response.get('results', []):\n\
          \            search.setdefault(row.get('url', ''), row)\n    extracted,\
          \ failed = {}, {}\n    for response in extract_json or []:\n        for\
          \ row in response.get('results', []):\n            extracted[row.get('url',\
          \ '')] = row\n        for row in response.get('failed_results', []):\n \
          \           failed[row.get('url', '')] = str(row.get('error') or row.get('message')\
          \ or 'Extraction failed')\n    selection = json.loads(selection_json)\n\
          \    assessments = {x['url']: x for x in selection['selected']}\n    sources\
          \ = []\n    for url in requested_urls:\n        s, r = search.get(url, {}),\
          \ extracted.get(url, {})\n        raw = r.get('raw_content') or ''\n   \
          \     if not isinstance(raw, str):\n            raw = str(raw)\n       \
          \ snippet = s.get('content') or ''\n        content = raw or snippet\n \
          \       truncated = len(content) > 8000\n        kept = content if not truncated\
          \ else content[:6000] + '\\n[OMITTED MIDDLE: content truncated; do not infer\
          \ omitted facts]\\n' + content[-2000:]\n        sources.append({\n     \
          \       'source_id': 'S-' + hashlib.sha256(url.encode()).hexdigest()[:12],\n\
          \            'url': url,\n            'title': r.get('title') or s.get('title')\
          \ or '',\n            'query': query,\n            'observed_at_utc': fetched_at,\n\
          \            'timestamp_meaning': 'tool response normalized at this time,\
          \ not publication time',\n            'read_status': 'success' if raw.strip()\
          \ else ('failed' if url in failed else 'empty_or_not_returned'),\n     \
          \       'read_error': failed.get(url, ''),\n            'evidence_type':\
          \ 'extracted_web_content' if raw.strip() else 'search_snippet',\n      \
          \      'content': kept,\n            'original_content_chars': len(content),\n\
          \            'content_truncated': truncated,\n            'publisher_type':\
          \ assessments.get(url, {}).get('source_type', 'unknown'),\n            'authority_status':\
          \ 'model_assessed_not_verified',\n            'selection_reason': assessments.get(url,\
          \ {}).get('selection_reason', '')\n        })\n    result = {'schema_version':\
          \ '1.0', 'query': query, 'sources': sources,\n              'selection_policy':\
          \ 'model-ranked candidate IDs, code-validated against search URLs; authority\
          \ not independently verified',\n              'primary_candidate_selected':\
          \ selection['primary_candidate_selected'],\n              'no_results':\
          \ not requested_urls}\n    return {'evidence_json': json.dumps(result, ensure_ascii=False)}\n"
