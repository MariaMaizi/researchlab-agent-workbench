    - data:
        code: "import json,re\n\ndef parse(text):\n    text=re.sub(r'<think\\b[^>]*>.*?</think>','',text,flags=re.S|re.I).strip()\n\
          \    return json.loads(re.sub(r'^```(?:json)?\\s*|\\s*```$','',text))\n\n\
          def main(queries_text: str, task_json: str) -> dict:\n    p=parse(queries_text);\
          \ task=json.loads(task_json)\n    if p.get('clarification'):\n        raise\
          \ ValueError('NEEDS_CLARIFICATION: '+str(p['clarification'])[:500])\n  \
          \  objects=p.get('objects',[]); dims=p.get('dimensions',[]); rows=p.get('queries',[])\n\
          \    if not 1<=len(objects)<=2 or not 1<=len(dims)<=4:\n        raise ValueError('本版每次支持1至2个候选、1至4个维度，请缩小研究范围。')\n\
          \    for i,o in enumerate(objects):\n        if o.get('id')!='O'+str(i+1)\
          \ or not o.get('name') or o['name'].casefold() not in task['candidates'].casefold():\n\
          \            raise ValueError('候选名称必须来自用户原文，禁止新增对象。')\n    if any(d.get('id')!='D'+str(i+1)\
          \ or not d.get('name') for i,d in enumerate(dims)):\n        raise ValueError('研究维度格式不正确。')\n\
          \    pairs={(o['id'],d['id']) for o in objects for d in dims}; seen=set();\
          \ queries=[]\n    for q in rows:\n        pair=(q.get('object_id'),q.get('dimension_id'));\
          \ query=str(q.get('query','')).strip()\n        if pair not in pairs or\
          \ pair in seen or not query or len(query)>300:\n            raise ValueError('查询矩阵缺项、重复或包含未知对象/维度。')\n\
          \        seen.add(pair);queries.append(query)\n    if seen!=pairs or len(set(queries))!=len(queries):\n\
          \        raise ValueError('每个候选×维度必须有一条独立且不重复的查询。')\n    p['coverage_note']='查询覆盖不代表已有证据；维度由模型解释，需要人工核对是否涵盖用户要求。'\n\
          \    return {'queries':queries,'plan_json':json.dumps(p,ensure_ascii=False)}\n"
