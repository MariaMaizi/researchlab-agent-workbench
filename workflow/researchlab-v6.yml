    - data:
        code: "import json\n\n\ndef main(batches: list) -> dict:\n    sources, seen,\
          \ queries, warnings = [], set(), [], []\n    failed_batches = []\n    for\
          \ batch_index, batch in enumerate(batches):\n        if not batch:\n   \
          \         failed_batches.append(batch_index)\n            warnings.append(f'Batch\
          \ {batch_index} failed before evidence normalization; inspect iteration\
          \ trace for the exact error.')\n            continue\n        item = json.loads(batch)\n\
          \        queries.append(item['query'])\n        if item.get('no_results'):\n\
          \            warnings.append('No selected URL for query: ' + item['query'])\n\
          \        for source in item['sources']:\n            url = source['url']\n\
          \            if url in seen:\n                old = next(s for s in sources\
          \ if s['url'] == url)\n                if old['read_status'] != 'success'\
          \ and source['read_status'] == 'success':\n                    sources[sources.index(old)]\
          \ = source\n                continue\n            seen.add(url)\n      \
          \      sources.append(source)\n    for s in sources:\n        if s['read_status']\
          \ != 'success':\n            warnings.append(s['source_id'] + ': ' + s['read_status'])\n\
          \        if s['content_truncated']:\n            warnings.append(s['source_id']\
          \ + ': content truncated; missing sections unknown')\n    stats = {'source_count':\
          \ len(sources),\n             'read_success_count': sum(s['read_status']\
          \ == 'success' for s in sources),\n             'truncated_count': sum(s['content_truncated']\
          \ for s in sources),\n             'query_count': len(batches), 'failed_batch_count':\
          \ len(failed_batches),\n             'collection_status': 'partial_or_failed'\
          \ if failed_batches else 'completed'}\n    eligible = [s for s in sources\
          \ if s.get('publisher_type') in ('primary_candidate', 'retailer')]\n   \
          \ excluded = [{'source_id': s['source_id'], 'url': s['url'], 'title': s['title'],\n\
          \                 'publisher_type': s.get('publisher_type', 'unknown'),\n\
          \                 'reason': 'Not a primary/retailer candidate; excluded\
          \ from factual analysis. Original content remains in per-iteration evidence.'}\n\
          \                for s in sources if s not in eligible]\n    stats['analysis_source_count']\
          \ = len(eligible)\n    stats['excluded_source_count'] = len(excluded)\n\
          \    for query in queries:\n        if not any(s['query'] == query for s\
          \ in eligible):\n            warnings.append('No eligible first-party/retailer\
          \ evidence for query: ' + query)\n    sources = eligible\n    ledger = {'schema_version':\
          \ '1.0', 'queries': queries, 'sources': sources, 'excluded_sources': excluded,\
          \ 'failed_batch_indices': failed_batches, 'warnings': warnings}\n    return\
          \ {'evidence_json': json.dumps(ledger, ensure_ascii=False),\n          \
          \  'collection_stats': json.dumps(stats, ensure_ascii=False)}\n"
