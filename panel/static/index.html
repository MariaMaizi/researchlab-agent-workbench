<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ResearchLab · 研究运行台</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/execution.css"></head>
<body><aside class="sidebar"><a class="brand" href="/" aria-label="ResearchLab首页"><span class="lab-logo"><i></i><i></i><i></i></span>ResearchLab</a><nav><button class="nav" id="newNav">＋　发起任务</button><button class="nav active" id="allNav">◷　运行记录 <span id="total">0</span></button><button class="nav" id="testsNav">☷　测试集</button><button class="nav" id="compareNav">▯　版本对比</button><button class="nav" id="settingsNav">⚙　设置</button></nav><div class="sidebar-bottom"><span class="dot"></span>本地工作空间<p>证据可追溯，结论待核查。<br>数据保存在这台电脑。</p></div></aside>
<div class="workspace"><header class="topbar"><div class="crumb">工作空间 <span>/</span> 研究任务 <span>/</span> <select id="runSelect" aria-label="选择研究任务"><option>尚无任务</option></select></div><div id="connection" class="connection">正在检查连接</div></header><main><div id="runPage"><div id="detail"></div></div><section id="otherPage" class="hidden"></section></main><footer>ResearchLab <span>本地原型 / 无公开部署</span></footer></div>
<dialog id="newDialog"><form id="newForm"><div class="dialog-head"><div><h2>新建选型研究</h2><p>先明确任务，再收集证据。</p></div><button type="button" class="close" data-close="newDialog" aria-label="关闭">×</button></div><div class="form-grid"><label class="wide">任务名称<input name="title" required maxlength="120" placeholder="例如：内部知识问答平台初筛"></label><label>流程版本<input name="version" value="v6" required></label><label>候选产品与版本<textarea name="candidates" required rows="3" placeholder="每行一个；未确定的版本明确注明"></textarea></label><label class="wide">业务用途<textarea name="use_case" required rows="2"></textarea></label><label class="wide">研究问题与维度<textarea name="question" required rows="3"></textarea></label><label>部署要求<textarea name="deployment" required rows="2"></textarea></label><label>必须满足的条件<textarea name="must_haves" rows="2"></textarea></label><label class="wide">补充资料（可选）<textarea name="materials" rows="2" placeholder="官方链接或待核实资料，仅作为研究线索"></textarea></label></div><div class="form-footer"><button type="button" class="text-button" id="exampleBtn">填入选型示例</button><button type="submit" class="button primary">保存研究任务</button></div><p class="form-note">保存不调用模型。配置应用 API 后可单独发起运行。</p></form></dialog>
<dialog id="importDialog"><form id="importForm"><div class="dialog-head"><div><h2>导入真实运行结果</h2><p>支持 Dify 输出 JSON 或本面板导出的记录。</p></div><button type="button" class="close" data-close="importDialog" aria-label="关闭">×</button></div><label>记录名称<input id="importTitle" value="导入的研究运行" required></label><label>流程版本<input id="importVersion" value="v6" required></label><label>读取 JSON 文件<input type="file" accept=".json,application/json" id="jsonFile"></label><label>或粘贴完整输出<textarea id="importJson" rows="11" required placeholder='{"report":"…","run_status":"needs_review","evidence_json":"…"}'></textarea></label><p class="form-note">只导入研究输出，不粘贴 API 密钥或授权信息。导入结果不等于重新运行。</p><div class="form-footer"><span></span><button class="button primary">导入并保存</button></div></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script src="/static/execution.js" defer></script></body></html>
